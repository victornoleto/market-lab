[project]
name = "ai-trade"
version = "0.1.0"
description = "ai-trade — knowledge base + systematic swing-trading pipeline (Pepperstone/cTrader)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Victor Noleto" }]

# NOTE: No `anthropic` / `openai` / any LLM SDK here. All LLM work runs inside
# Claude Code (subagents + slash commands). These Python scripts/modules are
# strictly deterministic: PDF extraction, validation, aggregation, market data,
# strategy execution.
dependencies = [
    # Phase 0 — knowledge base pipeline (PDFs → summaries → Claude Skill)
    "pymupdf>=1.24",            # Primary PDF → text
    "pdfplumber>=0.11",         # Fallback for tables/math-heavy pages
    "rich>=13.7",               # CLI output
    # Phase 1 — Pepperstone/cTrader infra (note: ctrader-open-api, twisted,
    # and protobuf are declared in the optional `ctrader` group below because
    # the current release of ctrader-open-api (0.9.2) hard-pins protobuf==3.20.1
    # and Twisted==21.7.0, which conflict with anything modern. They only need
    # to be installed when the Phase 1 runtime client is being built.
    "psycopg[binary]>=3.2",     # Postgres driver (sync)
    "pydantic>=2.6",            # Typed models + validation
    "pydantic-settings>=2.2",   # .env → typed Settings
    "tenacity>=8.2",            # Retry logic (reconnects, backoff)
    # Phase 2 — Backtest data sources + analytics
    "pandas>=2.2",              # Dataframes for OHLCV + features
    "numpy>=1.26",              # Numerical backend for pandas and strategies
    "scipy>=1.11",              # norm CDF/PPF for DSR/PSR, combinatorics for CPCV
    "pyarrow>=15.0",            # Parquet-backed cache (yfinance/wikipedia)
    "yfinance>=0.2",            # Yahoo Finance daily OHLCV (research, Etapa 1)
    "lxml>=5.0",                # HTML parsing for pandas.read_html (Wikipedia)
    "matplotlib>=3.8",          # Equity/drawdown PNG charts in backtest reports
    "joblib>=1.3",              # Parallel grid execution (Fase 2.5) — generator_unordered
    "tqdm>=4.66",               # Progress bars for long grid runs (Fase 2.5)
    "scikit-learn>=1.4",        # RandomForest/GBM for AFML meta-labeling (Fase 2.5 Run 4)
    "typer>=0.12",              # ops/ CLI
    "requests>=2.31",           # BCB SGS HTTP client
    "holidays>=0.50",           # BR feriados bancários
    "cryptography>=42.0",       # encrypted backup
]

[project.optional-dependencies]
# Install only when wiring the Phase 1 runtime (post Spotware app approval):
#   .venv/bin/pip install -e '.[ctrader]'
# The pins below come from ctrader-open-api's own setup.py; loosening them
# requires a fork or patch of the SDK.
ctrader = [
    "ctrader-open-api>=0.9",
    "twisted==21.7.0",
    "protobuf==3.20.1",
]

[project.scripts]
ops = "ops.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "requests-mock>=1.12",      # mock BCB/yfinance in tests
    "hypothesis>=6.100",        # property-based (Phase 2, opt)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_trade", "ops"]

[tool.pytest.ini_options]
# Put repo root on sys.path so `from scripts import ...` works in tests
# (scripts/ is a directory of CLI entrypoints, not a distributed package).
# src/ai_trade is importable as `ai_trade` via `pip install -e .` (hatch layout).
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
