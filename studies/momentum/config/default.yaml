database:
  url_env: YFINANCE_DATABASE_URL
  fallback_url_env: DATABASE_URL
  schema: public
  price_column: adj_close

run:
  start: 2000-01-01
  end: null
  benchmark_by_universe:
    us_stocks: SPY
    us_etfs: SPY
    us_mixed: SPY
    br_stocks: BOVA11.SA
    br_etfs: BOVA11.SA
    br_mixed: BOVA11.SA
    crypto: BTC-USD
    global_mixed: SPY
  max_symbols_per_universe: null
  min_assets_after_filter: 5

filters:
  default:
    min_history_months: 36
    min_price: 5.0
    min_median_dollar_volume: 1000000
    liquidity_lookback_days: 252
    min_trading_days_per_year: 180
    max_stale_days: 14
  us_stock:
    min_history_months: 60
    min_price: 5.0
    min_median_dollar_volume: 5000000
  us_etf:
    min_history_months: 36
    min_price: 5.0
    min_median_dollar_volume: 2000000
  br_stock:
    min_history_months: 36
    min_price: 2.0
    min_median_dollar_volume: 500000
  br_etf:
    min_history_months: 24
    min_price: 2.0
    min_median_dollar_volume: 100000
  crypto:
    min_history_months: 24
    min_price: 0.0
    min_median_dollar_volume: 0
    max_stale_days: 3

features:
  lookbacks:
    raw_13612: [1, 3, 6, 12]
    mom_3_6_12: [3, 6, 12]
  vol_window_days: 126
  trend_window_days: 126

grid:
  universes:
    - us_stocks
    - us_etfs
    - br_stocks
    - br_etfs
    - crypto
  top_n: [1, 3, 5, 10, 15, 20, 30, 50]
  rebalance_months: [1, 3, 6, 12]
  rebalance_offsets: all
  staggered_offsets: [false, true]
  score_modes:
    - raw_13612
    - mom_12_1
    - mom_3_6_12
    - clenow_trend
    - vol_adjusted
    - mom_lowvol_composite
  weight_modes:
    - equal
    - inverse_vol
    - capped_inverse_vol
  absolute_filter: [false, true]
  weight_cap: 0.25

validation:
  pbo_blocks: 10
  dsr_alpha: 0.05
  wf_min_windows: 8
  wf_min_positive: 6
  broad_bootstrap_resamples: 0
  broad_pbo_max_configs: 1000
  broad_rolling_years: []
  bootstrap_resamples: 1000
  bootstrap_block_days: 21
  bootstrap_ci_low_pct: 0.1
  rolling_years: [3, 5, 10, 15]
