<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Factor tilt profiles</title>
  <desc id="desc">Stacked bars comparing core, small-cap value and momentum weights across five factor tilt profiles.</desc>
  <rect width="920" height="420" fill="#ffffff"/>
  <text x="40" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Factor Tilt Profiles</text>
  <text x="40" y="68" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">Weights are policy bands/round numbers, not optimized backtest outputs.</text>
  <rect x="40" y="92" width="14" height="14" fill="#4e79a7"/>
  <text x="60" y="104" font-family="Arial, sans-serif" font-size="13" fill="#111827">Core</text>
  <rect x="120" y="92" width="14" height="14" fill="#f28e2b"/>
  <text x="140" y="104" font-family="Arial, sans-serif" font-size="13" fill="#111827">SCV</text>
  <rect x="190" y="92" width="14" height="14" fill="#59a14f"/>
  <text x="210" y="104" font-family="Arial, sans-serif" font-size="13" fill="#111827">Momentum</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#111827">
    <text x="40" y="145">Pure beta</text>
    <rect x="210" y="128" width="600" height="24" fill="#4e79a7"/>
    <text x="820" y="145">100 / 0 / 0</text>
    <text x="480" y="145" fill="#ffffff" text-anchor="middle">100%</text>
    <text x="40" y="195">Mild factor</text>
    <rect x="210" y="178" width="480" height="24" fill="#4e79a7"/>
    <rect x="690" y="178" width="60" height="24" fill="#f28e2b"/>
    <rect x="750" y="178" width="60" height="24" fill="#59a14f"/>
    <text x="820" y="195">80 / 10 / 10</text>
    <text x="450" y="195" fill="#ffffff" text-anchor="middle">80%</text>
    <text x="40" y="245">Balanced default</text>
    <rect x="210" y="228" width="420" height="24" fill="#4e79a7"/>
    <rect x="630" y="228" width="90" height="24" fill="#f28e2b"/>
    <rect x="720" y="228" width="90" height="24" fill="#59a14f"/>
    <text x="820" y="245">70 / 15 / 15</text>
    <text x="420" y="245" fill="#ffffff" text-anchor="middle">70%</text>
    <text x="40" y="295">Aggressive factor</text>
    <rect x="210" y="278" width="360" height="24" fill="#4e79a7"/>
    <rect x="570" y="278" width="120" height="24" fill="#f28e2b"/>
    <rect x="690" y="278" width="120" height="24" fill="#59a14f"/>
    <text x="820" y="295">60 / 20 / 20</text>
    <text x="390" y="295" fill="#ffffff" text-anchor="middle">60%</text>
    <text x="40" y="345">Factor barbell</text>
    <rect x="210" y="328" width="390" height="24" fill="#4e79a7"/>
    <rect x="600" y="328" width="150" height="24" fill="#f28e2b"/>
    <rect x="750" y="328" width="60" height="24" fill="#59a14f"/>
    <text x="820" y="345">65 / 25 / 10</text>
    <text x="405" y="345" fill="#ffffff" text-anchor="middle">65%</text>
  </g>
  <text x="40" y="392" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Figure: Balanced default avoids letting one factor sleeve dominate; aggressive 60/20/20 is a sensitivity, not a fitted optimum.</text>
</svg>
