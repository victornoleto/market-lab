<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Candidate portfolio allocations</title>
  <desc id="desc">Stacked bars comparing ETF weights across six candidate portfolios.</desc>
  <rect width="980" height="560" fill="#ffffff"/>
  <text x="40" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Candidate Portfolio Allocations</text>
  <text x="40" y="68" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">Candidate C is the analytical default; Candidate B is the simple Avantis core.</text>
  <g font-family="Arial, sans-serif" font-size="12" fill="#111827">
    <rect x="40" y="92" width="12" height="12" fill="#4e79a7"/><text x="58" y="102">VTI / AVUS</text>
    <rect x="145" y="92" width="12" height="12" fill="#f28e2b"/><text x="163" y="102">AVUV</text>
    <rect x="215" y="92" width="12" height="12" fill="#59a14f"/><text x="233" y="102">Momentum ETFs</text>
    <rect x="295" y="92" width="12" height="12" fill="#a0cbe8"/><text x="313" y="102">VEA / AVDE</text>
    <rect x="410" y="92" width="12" height="12" fill="#b07aa1"/><text x="428" y="102">AVDV</text>
    <rect x="480" y="92" width="12" height="12" fill="#e15759"/><text x="498" y="102">VWO / AVEM</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#111827">
    <text x="40" y="145">A: market-cap benchmark</text>
    <rect x="250" y="128" width="360" height="24" fill="#4e79a7"/>
    <rect x="610" y="128" width="180" height="24" fill="#a0cbe8"/>
    <rect x="790" y="128" width="60" height="24" fill="#e15759"/>
    <text x="860" y="145">60 VTI / 30 VEA / 10 VWO</text>
    <text x="40" y="205">B: simple Avantis core</text>
    <rect x="250" y="188" width="390" height="24" fill="#4e79a7"/>
    <rect x="640" y="188" width="150" height="24" fill="#a0cbe8"/>
    <rect x="790" y="188" width="60" height="24" fill="#e15759"/>
    <text x="860" y="205">65 AVUS / 25 AVDE / 10 AVEM</text>
    <text x="40" y="265">C: balanced factor default</text>
    <rect x="250" y="248" width="270" height="24" fill="#4e79a7"/>
    <rect x="520" y="248" width="60" height="24" fill="#f28e2b"/>
    <rect x="580" y="248" width="60" height="24" fill="#59a14f"/>
    <rect x="640" y="248" width="120" height="24" fill="#a0cbe8"/>
    <rect x="760" y="248" width="30" height="24" fill="#b07aa1"/>
    <rect x="790" y="248" width="60" height="24" fill="#e15759"/>
    <text x="860" y="265">45 / 10 / 10 / 20 / 5 / 10</text>
    <text x="40" y="325">D: aggressive US factor</text>
    <rect x="250" y="308" width="240" height="24" fill="#4e79a7"/>
    <rect x="490" y="308" width="90" height="24" fill="#f28e2b"/>
    <rect x="580" y="308" width="60" height="24" fill="#59a14f"/>
    <rect x="640" y="308" width="120" height="24" fill="#a0cbe8"/>
    <rect x="760" y="308" width="30" height="24" fill="#b07aa1"/>
    <rect x="790" y="308" width="60" height="24" fill="#e15759"/>
    <text x="860" y="325">40 / 15 / 10 / 20 / 5 / 10</text>
    <text x="40" y="385">E: short-live winner shape</text>
    <rect x="250" y="368" width="234" height="24" fill="#4e79a7"/>
    <rect x="484" y="368" width="78" height="24" fill="#f28e2b"/>
    <rect x="562" y="368" width="78" height="24" fill="#59a14f"/>
    <rect x="640" y="368" width="120" height="24" fill="#a0cbe8"/>
    <rect x="760" y="368" width="30" height="24" fill="#b07aa1"/>
    <rect x="790" y="368" width="60" height="24" fill="#e15759"/>
    <text x="860" y="385">39 / 13 / 13 / 20 / 5 / 10</text>
    <text x="40" y="445">F: global momentum symmetry</text>
    <rect x="250" y="428" width="270" height="24" fill="#4e79a7"/>
    <rect x="520" y="428" width="60" height="24" fill="#f28e2b"/>
    <rect x="580" y="428" width="60" height="24" fill="#59a14f"/>
    <rect x="640" y="428" width="90" height="24" fill="#a0cbe8"/>
    <rect x="730" y="428" width="30" height="24" fill="#b07aa1"/>
    <rect x="760" y="428" width="30" height="24" fill="#59a14f"/>
    <rect x="790" y="428" width="42" height="24" fill="#e15759"/>
    <rect x="832" y="428" width="18" height="24" fill="#59a14f"/>
    <text x="860" y="445">45 / 10 / 10 / 15 / 5 / 5 / 7 / 3</text>
  </g>
  <text x="40" y="515" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Figure: Candidate F keeps 65/25/10 geography but spreads momentum beyond the US via IDMO/EEMO.</text>
</svg>
