# Shared defaults for every momentum_v2 universe. Per-universe files in this
# directory deep-merge their overrides on top of this (see config.py).

database:
  url_env: YFINANCE_DATABASE_URL
  fallback_url_env: DATABASE_URL
  schema: public
  price_column: adj_close

run:
  start: 1990-01-01        # primary window; re-run robustness with --start 2000-01-01
  end: null
  benchmark_by_universe:
    us_stocks: SPY
    us_etfs: SPY
    us_mixed: SPY
    br_stocks: BOVA11.SA
    br_etfs: BOVA11.SA
    br_mixed: BOVA11.SA
    crypto: BTC-USD
  max_symbols_per_universe: null
  min_assets_after_filter: 5

# Survivorship-mitigation filters `[advances_fin_ml, p.208-211]`. `default`
# applies everywhere; `<country>_<asset>` keys tighten one slice.
filters:
  default:
    min_history_months: 36
    min_price: 5.0
    min_median_dollar_volume: 1000000
    liquidity_lookback_days: 252
    min_trading_days_per_year: 180
    max_stale_days: 14

features:
  vol_window_days: 126
  trend_window_days: 126

# Broad-phase grid. Each axis is an explicit tested degree of freedom
# `[advances_fin_ml, p.273-275]`. rebalance_offsets: 0 keeps the grid tractable;
# set to `all` to expand every offset. top_n excludes 1 (too volatile) and 50
# (unmanageable by hand) per the study brief.
grid:
  score_modes:
    - raw_13612            # `[stocks_on_the_move, p.60]`
    - mom_12_1
    - vol_adjusted_13612   # `[systematic_trading, p.137-148]`
    - clenow_trend         # `[stocks_on_the_move, p.70-77, p.98]`
    - composite_mom_lowvol
  lookback_profiles: ["1_3_6_12", "3_6_12", "6_12", "6"]
  top_n: [3, 5, 10, 15, 20]
  rebalance_months: [1, 3, 6, 12]
  rebalance_offsets: [0]
  weight_modes: [equal, inverse_vol]
  absolute_filter: [false, true]

# Evolution phase: overlays + staggering applied to the strongest broad finalists.
# selection_metrics drives which broad/evolution rows become finalists — union of
# the top-`max_finalists` by each metric (deduped). Set to Sharpe + Calmar per the
# return/risk-adjusted objective; use ["rolling_rel_score"] for the dominance lens.
evolution:
  max_finalists: 6
  selection_metrics: [after_tax_sharpe, after_tax_calmar]
  # overlays/offset_modes default to the full sets in overlays.py.

validation:
  pbo_blocks: 10
  dsr_alpha: 0.05
  wf_min_windows: 8
  # MDD is a warning-only tier, not a hard gate (mandate §5: "CAGR/MDD são tiers").
  # 1.0 makes drawdown non-binding in WF, so the gate is pure >=6/8 profitable windows.
  wf_max_drawdown: 1.0
  broad_pbo_max_configs: 1000
  bootstrap_resamples: 1000
  bootstrap_block_days: 21
