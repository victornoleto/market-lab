iter: 004-2026-05-06-T1d-full-grid
tier: T1d
hypothesis: 'Robustness mapping check: grid sweep of all (on, off, signal, period) combos. Tests whether T1c sequential winner
  (qld_sma200_off_zroz Sharpe 0.752) is robust to perturbations in the on/period/signal axes. Anti-curve-fit pre-registered:
  T1d-best Sharpe must exceed T1c-best + 0.05 = 0.802 to claim a new T1 winner; otherwise T1c stands.'
